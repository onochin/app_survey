<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">方位角と緯距・経距</title>
  <desc id="desc">北を0度として時計回りに測る方位角と、距離をX方向の緯距とY方向の経距へ分解する関係図</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#dce9f3" stroke-width="1"/>
    </pattern>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#17345a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#1f78c8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#db6b2c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17345a" flood-opacity=".12"/>
    </filter>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
      .small { font-size: 18px; fill: #60758b; }
      .axis { font-size: 21px; font-weight: 800; }
      .formula { font-size: 24px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#f6fafe"/>
  <text x="48" y="57" font-size="30" font-weight="800">1本の辺を、北方向と東方向の「進み量」に分ける</text>
  <text x="48" y="86" class="small">このアプリでは X＝北方向、Y＝東方向、方位角α＝北0°から時計回りです。</text>

  <g transform="translate(42 112)">
    <rect width="710" height="478" rx="22" fill="url(#grid)" stroke="#cbdbe9"/>
    <line x1="110" y1="405" x2="110" y2="55" stroke="#17345a" stroke-width="4" marker-end="url(#arrow-dark)"/>
    <line x1="110" y1="405" x2="650" y2="405" stroke="#17345a" stroke-width="4" marker-end="url(#arrow-dark)"/>
    <text x="128" y="72" class="axis">X（北）</text>
    <text x="563" y="447" class="axis">Y（東）</text>

    <line x1="110" y1="405" x2="490" y2="145" stroke="#1f78c8" stroke-width="8" marker-end="url(#arrow-blue)"/>
    <line x1="110" y1="405" x2="110" y2="145" stroke="#db6b2c" stroke-width="7" marker-end="url(#arrow-orange)"/>
    <line x1="110" y1="405" x2="490" y2="405" stroke="#db6b2c" stroke-width="7" marker-end="url(#arrow-orange)"/>
    <line x1="110" y1="145" x2="490" y2="145" stroke="#9eb3c6" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="490" y1="405" x2="490" y2="145" stroke="#9eb3c6" stroke-width="3" stroke-dasharray="10 8"/>

    <path d="M110 317 A88 88 0 0 1 183 356" fill="none" stroke="#247454" stroke-width="6"/>
    <text x="145" y="324" font-size="24" font-weight="900" fill="#247454">α</text>

    <circle cx="110" cy="405" r="13" fill="#17345a" stroke="#fff" stroke-width="4"/>
    <text x="82" y="440" font-size="20" font-weight="800">現点</text>
    <circle cx="490" cy="145" r="13" fill="#1f78c8" stroke="#fff" stroke-width="4"/>
    <text x="507" y="138" font-size="20" font-weight="800">次点</text>

    <rect x="278" y="225" width="128" height="40" rx="20" fill="#e7f3ff" stroke="#9cc8ed"/>
    <text x="342" y="252" text-anchor="middle" font-size="21" font-weight="900" fill="#1f78c8">距離 S</text>
    <rect x="18" y="241" width="143" height="40" rx="20" fill="#fff1e7" stroke="#efbd99"/>
    <text x="90" y="268" text-anchor="middle" font-size="20" font-weight="900" fill="#db6b2c">緯距 ΔX</text>
    <rect x="273" y="374" width="143" height="40" rx="20" fill="#fff1e7" stroke="#efbd99"/>
    <text x="345" y="401" text-anchor="middle" font-size="20" font-weight="900" fill="#db6b2c">経距 ΔY</text>
  </g>

  <g transform="translate(790 114)" filter="url(#shadow)">
    <rect width="370" height="220" rx="22" fill="#fff" stroke="#d6e3ee"/>
    <text x="28" y="44" font-size="19" font-weight="800" fill="#60758b">距離を成分へ分解</text>
    <text x="28" y="94" class="formula">ΔX = S × cos α</text>
    <text x="28" y="136" class="formula">ΔY = S × sin α</text>
    <path d="M28 163H342" stroke="#dce5ed"/>
    <text x="28" y="194" class="small">符号も含めて座標へ加えます</text>
  </g>

  <g transform="translate(790 356)" filter="url(#shadow)">
    <rect width="370" height="234" rx="22" fill="#17345a"/>
    <text x="28" y="44" font-size="19" font-weight="800" fill="#9ed4ff">方位角の目安</text>
    <g transform="translate(34 72)">
      <circle cx="82" cy="67" r="54" fill="none" stroke="#6c8aa7" stroke-width="3"/>
      <path d="M82 67V4M82 67h63M82 67v63M82 67H19" stroke="#fff" stroke-width="3"/>
      <text x="82" y="-5" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">北 0°</text>
      <text x="154" y="73" font-size="17" font-weight="800" fill="#fff">東 90°</text>
      <text x="82" y="151" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">南 180°</text>
      <text x="12" y="73" font-size="16" font-weight="800" fill="#fff">西 270°</text>
    </g>
    <text x="206" y="100" font-size="18" font-weight="700" fill="#fff">北から</text>
    <text x="206" y="132" font-size="25" font-weight="900" fill="#fff">時計回り</text>
    <text x="206" y="168" font-size="16" fill="#d7e9f9">数学の角度とは</text>
    <text x="206" y="194" font-size="16" fill="#d7e9f9">基準が違うので注意</text>
  </g>
</svg>
