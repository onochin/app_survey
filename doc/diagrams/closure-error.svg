<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">閉合差の意味</title>
  <desc id="desc">閉合トラバースで本来戻るべき出発点と計算上の終点がずれ、その差をX方向fx、Y方向fy、合成閉合差fで表す図</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dce9f3" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#1f78c8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#db6b2c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17345a" flood-opacity=".12"/>
    </filter>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
      .small { font-size: 18px; fill: #60758b; }
      .formula { font-size: 23px; font-weight: 800; }
      .vector-label { paint-order: stroke; stroke: #f6fafe; stroke-width: 7px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#f6fafe"/>
  <text x="48" y="57" font-size="30" font-weight="800">一周して「戻るはずの点」と「計算上の終点」のずれを測る</text>
  <text x="48" y="86" class="small">観測には小さな誤差が含まれるため、計算上は出発点へぴったり戻らないのが普通です。</text>

  <g transform="translate(42 112)">
    <rect width="720" height="490" rx="22" fill="url(#grid)" stroke="#cbdbe9"/>
    <path d="M210 354 136 188 302 70 510 137 553 331 355 424 210 354"
      fill="rgb(35 118 200 / 6%)" stroke="#8da5ba" stroke-width="5" stroke-linejoin="round"/>
    <path d="M210 354 136 188 302 70 510 137 553 331 355 424 287 300"
      fill="none" stroke="#315a87" stroke-width="6" stroke-linejoin="round"/>

    <g fill="#fff" stroke="#315a87" stroke-width="5">
      <circle cx="136" cy="188" r="10"/>
      <circle cx="302" cy="70" r="10"/>
      <circle cx="510" cy="137" r="10"/>
      <circle cx="553" cy="331" r="10"/>
      <circle cx="355" cy="424" r="10"/>
    </g>

    <circle cx="210" cy="354" r="17" fill="#247454" stroke="#fff" stroke-width="6"/>
    <circle cx="210" cy="354" r="5" fill="#fff"/>
    <text x="88" y="404" class="vector-label" font-size="20" font-weight="900" fill="#247454">本来の閉合点 A</text>

    <circle cx="287" cy="300" r="15" fill="#db6b2c" stroke="#fff" stroke-width="6"/>
    <text x="306" y="282" class="vector-label" font-size="20" font-weight="900" fill="#b85825">計算上の終点 A′</text>

    <line x1="210" y1="354" x2="210" y2="300" stroke="#db6b2c" stroke-width="6" marker-end="url(#arrow-orange)"/>
    <line x1="210" y1="354" x2="287" y2="354" stroke="#db6b2c" stroke-width="6" marker-end="url(#arrow-orange)"/>
    <line x1="210" y1="354" x2="287" y2="300" stroke="#1f78c8" stroke-width="7" marker-end="url(#arrow-blue)"/>
    <line x1="210" y1="300" x2="287" y2="300" stroke="#9eb3c6" stroke-width="3" stroke-dasharray="8 7"/>
    <line x1="287" y1="354" x2="287" y2="300" stroke="#9eb3c6" stroke-width="3" stroke-dasharray="8 7"/>

    <text x="174" y="329" class="vector-label" font-size="20" font-weight="900" fill="#db6b2c">fx</text>
    <text x="243" y="382" class="vector-label" font-size="20" font-weight="900" fill="#db6b2c">fy</text>
    <text x="257" y="322" class="vector-label" font-size="21" font-weight="900" fill="#1f78c8">f</text>

    <rect x="421" y="379" width="270" height="78" rx="14" fill="#fff1e7" stroke="#efbd99"/>
    <text x="441" y="410" font-size="18" font-weight="900" fill="#b85825">図では誤差を拡大</text>
    <text x="441" y="438" class="small">実際のずれは通常とても小さい</text>
  </g>

  <g transform="translate(795 112)" filter="url(#shadow)">
    <rect width="365" height="218" rx="22" fill="#fff" stroke="#d6e3ee"/>
    <text x="28" y="43" font-size="19" font-weight="800" fill="#60758b">座標閉合差</text>
    <text x="28" y="83" class="formula">fx = ΣΔX</text>
    <text x="28" y="120" class="formula">fy = ΣΔY</text>
    <text x="28" y="169" class="formula" fill="#1f78c8">f = √(fx² + fy²)</text>
    <text x="28" y="198" class="small">f が平面上のずれの大きさ</text>
  </g>

  <g transform="translate(795 352)" filter="url(#shadow)">
    <rect width="365" height="250" rx="22" fill="#17345a"/>
    <text x="28" y="44" font-size="19" font-weight="800" fill="#9ed4ff">閉合比</text>
    <text x="28" y="87" font-size="24" font-weight="900" fill="#fff">f ÷ 路線の総延長</text>
    <text x="28" y="124" font-size="19" fill="#d7e9f9">例：総延長 900 m</text>
    <text x="28" y="157" font-size="19" fill="#d7e9f9">　　閉合差 0.018 m</text>
    <text x="28" y="199" font-size="25" font-weight="900" fill="#fff">閉合比 1 / 50,000</text>
    <text x="28" y="230" font-size="17" fill="#9ed4ff">分母が大きいほど相対的なずれが小さい</text>
  </g>
</svg>
