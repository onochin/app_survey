<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">正方形で理解する緯距と経距</title>
  <desc id="desc">一辺100メートルの正方形を北、東、南、西へ進むとX方向成分とY方向成分の合計がそれぞれゼロになり出発点へ戻る例</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#1f78c8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17345a" flood-opacity=".12"/>
    </filter>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
      .small { font-size: 18px; fill: #60758b; }
      .edge { font-size: 18px; font-weight: 800; fill: #315a87; }
      .cell { font-size: 17px; }
      .cell-strong { font-size: 17px; font-weight: 900; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#f6fafe"/>
  <text x="48" y="57" font-size="30" font-weight="800">100 mの正方形なら、4本の「進み量」が打ち消し合う</text>
  <text x="48" y="86" class="small">誤差がない理想例です。北へ進んだ分だけ南へ、東へ進んだ分だけ西へ戻ります。</text>

  <g transform="translate(60 125)">
    <rect width="470" height="460" rx="22" fill="#fff" stroke="#d6e3ee" filter="url(#shadow)"/>
    <line x1="115" y1="355" x2="115" y2="95" stroke="#1f78c8" stroke-width="8" marker-end="url(#arrow)"/>
    <line x1="115" y1="95" x2="375" y2="95" stroke="#1f78c8" stroke-width="8" marker-end="url(#arrow)"/>
    <line x1="375" y1="95" x2="375" y2="355" stroke="#1f78c8" stroke-width="8" marker-end="url(#arrow)"/>
    <line x1="375" y1="355" x2="115" y2="355" stroke="#1f78c8" stroke-width="8" marker-end="url(#arrow)"/>

    <g>
      <circle cx="115" cy="355" r="16" fill="#247454" stroke="#fff" stroke-width="5"/>
      <circle cx="115" cy="95" r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
      <circle cx="375" cy="95" r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
      <circle cx="375" cy="355" r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
    </g>
    <text x="87" y="390" font-size="20" font-weight="900" fill="#247454">A（出発・到着）</text>
    <text x="88" y="72" font-size="19" font-weight="800">P1</text>
    <text x="388" y="102" font-size="19" font-weight="800">P2</text>
    <text x="388" y="362" font-size="19" font-weight="800">P3</text>

    <rect x="28" y="208" width="105" height="34" rx="17" fill="#e7f3ff"/>
    <text x="81" y="231" text-anchor="middle" class="edge">北 100m</text>
    <rect x="195" y="60" width="105" height="34" rx="17" fill="#e7f3ff"/>
    <text x="248" y="83" text-anchor="middle" class="edge">東 100m</text>
    <rect x="342" y="208" width="105" height="34" rx="17" fill="#e7f3ff"/>
    <text x="395" y="231" text-anchor="middle" class="edge">南 100m</text>
    <rect x="195" y="337" width="105" height="34" rx="17" fill="#e7f3ff"/>
    <text x="248" y="360" text-anchor="middle" class="edge">西 100m</text>

    <rect x="82" y="406" width="306" height="35" rx="17" fill="#e9f7f0"/>
    <text x="235" y="430" text-anchor="middle" font-size="18" font-weight="900" fill="#247454">最後はAへぴったり戻る</text>
  </g>

  <g transform="translate(565 125)" filter="url(#shadow)">
    <rect width="575" height="460" rx="22" fill="#fff" stroke="#d6e3ee"/>
    <rect width="575" height="58" rx="22" fill="#17345a"/>
    <path d="M0 58H575" stroke="#17345a"/>
    <text x="30" y="37" font-size="19" font-weight="800" fill="#fff">辺</text>
    <text x="148" y="37" font-size="19" font-weight="800" fill="#fff">方位角</text>
    <text x="289" y="37" font-size="19" font-weight="800" fill="#fff">ΔX（北）</text>
    <text x="445" y="37" font-size="19" font-weight="800" fill="#fff">ΔY（東）</text>

    <g stroke="#dce5ed">
      <path d="M0 129H575M0 200H575M0 271H575M0 342H575M0 405H575"/>
      <path d="M112 0V405M255 0V405M410 0V405"/>
    </g>

    <text x="30" y="101" class="cell-strong">A→P1</text>
    <text x="148" y="101" class="cell">0°</text>
    <text x="289" y="101" class="cell-strong" fill="#247454">+100</text>
    <text x="445" y="101" class="cell">0</text>

    <text x="30" y="172" class="cell-strong">P1→P2</text>
    <text x="148" y="172" class="cell">90°</text>
    <text x="289" y="172" class="cell">0</text>
    <text x="445" y="172" class="cell-strong" fill="#247454">+100</text>

    <text x="30" y="243" class="cell-strong">P2→P3</text>
    <text x="148" y="243" class="cell">180°</text>
    <text x="289" y="243" class="cell-strong" fill="#b85825">−100</text>
    <text x="445" y="243" class="cell">0</text>

    <text x="30" y="314" class="cell-strong">P3→A</text>
    <text x="148" y="314" class="cell">270°</text>
    <text x="289" y="314" class="cell">0</text>
    <text x="445" y="314" class="cell-strong" fill="#b85825">−100</text>

    <rect x="0" y="342" width="575" height="63" fill="#e9f7f0"/>
    <text x="30" y="381" class="cell-strong">合計</text>
    <text x="289" y="381" class="cell-strong" fill="#247454">0</text>
    <text x="445" y="381" class="cell-strong" fill="#247454">0</text>

    <text x="28" y="437" font-size="18" font-weight="800" fill="#247454">ΣΔX = 0、ΣΔY = 0 なので座標は閉合します。</text>
  </g>
</svg>
