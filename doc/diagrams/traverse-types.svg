<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">トラバース測量の3種類</title>
  <desc id="desc">閉合トラバース、結合トラバース、開放トラバースの経路と点検性の違いを並べた図</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#315a87"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17345a" flood-opacity=".12"/>
    </filter>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
      .panel-title { font-size: 25px; font-weight: 900; }
      .subtitle { font-size: 17px; fill: #60758b; }
      .point { font-size: 18px; font-weight: 800; }
      .badge { font-size: 16px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#f6fafe"/>
  <text x="48" y="57" font-size="30" font-weight="800">経路の終わり方で、誤差を点検できる強さが変わる</text>
  <text x="48" y="86" class="subtitle">図は考え方を単純化したものです。実務では既知点や方向の取り方など追加条件があります。</text>

  <g transform="translate(38 116)" filter="url(#shadow)">
    <rect width="354" height="480" rx="22" fill="#fff" stroke="#d6e3ee"/>
    <rect width="354" height="72" rx="22" fill="#e9f7f0"/>
    <path d="M0 72H354" stroke="#c8e8d7"/>
    <text x="24" y="34" class="panel-title">閉合トラバース</text>
    <text x="24" y="58" class="subtitle">出発点へ戻って輪になる</text>

    <g transform="translate(28 95)" fill="none" stroke="#315a87" stroke-width="5" stroke-linejoin="round">
      <path d="M44 248 99 86 242 55 295 185 197 304 44 248" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(28 95)">
      <g transform="translate(44 248)">
        <circle r="16" fill="#1f78c8" stroke="#fff" stroke-width="5"/>
        <text x="-1" y="40" text-anchor="middle" class="point">A</text>
      </g>
      <g transform="translate(99 86)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="-1" y="-22" text-anchor="middle" class="point">P1</text>
      </g>
      <g transform="translate(242 55)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="0" y="-22" text-anchor="middle" class="point">P2</text>
      </g>
      <g transform="translate(295 185)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="22" y="7" class="point">P3</text>
      </g>
      <g transform="translate(197 304)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="0" y="37" text-anchor="middle" class="point">P4</text>
      </g>
    </g>
    <rect x="24" y="406" width="306" height="48" rx="13" fill="#e9f7f0"/>
    <text x="177" y="436" text-anchor="middle" class="badge" fill="#247454">角度・座標の閉合差を確認しやすい</text>
  </g>

  <g transform="translate(423 116)" filter="url(#shadow)">
    <rect width="354" height="480" rx="22" fill="#fff" stroke="#d6e3ee"/>
    <rect width="354" height="72" rx="22" fill="#e7f3ff"/>
    <path d="M0 72H354" stroke="#c5def5"/>
    <text x="24" y="34" class="panel-title">結合トラバース</text>
    <text x="24" y="58" class="subtitle">既知点から別の既知点へ結ぶ</text>

    <g transform="translate(25 112)" fill="none" stroke="#315a87" stroke-width="5" stroke-linejoin="round">
      <path d="M36 238 101 104 190 196 278 67" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(25 112)">
      <g transform="translate(36 238)">
        <circle r="16" fill="#1f78c8" stroke="#fff" stroke-width="5"/>
        <text x="-1" y="40" text-anchor="middle" class="point">既知点A</text>
      </g>
      <g transform="translate(101 104)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="-1" y="-22" text-anchor="middle" class="point">P1</text>
      </g>
      <g transform="translate(190 196)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="0" y="37" text-anchor="middle" class="point">P2</text>
      </g>
      <g transform="translate(278 67)">
        <circle r="16" fill="#1f78c8" stroke="#fff" stroke-width="5"/>
        <text x="0" y="-25" text-anchor="middle" class="point">既知点B</text>
      </g>
    </g>
    <rect x="24" y="406" width="306" height="48" rx="13" fill="#e7f3ff"/>
    <text x="177" y="436" text-anchor="middle" class="badge" fill="#1f78c8">既知の終点との差で点検できる</text>
  </g>

  <g transform="translate(808 116)" filter="url(#shadow)">
    <rect width="354" height="480" rx="22" fill="#fff" stroke="#d6e3ee"/>
    <rect width="354" height="72" rx="22" fill="#fff1e7"/>
    <path d="M0 72H354" stroke="#f2d2bb"/>
    <text x="24" y="34" class="panel-title">開放トラバース</text>
    <text x="24" y="58" class="subtitle">未知の点で終わり、閉じない</text>

    <g transform="translate(25 112)" fill="none" stroke="#315a87" stroke-width="5" stroke-linejoin="round">
      <path d="M36 238 101 104 190 196 278 67" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(25 112)">
      <g transform="translate(36 238)">
        <circle r="16" fill="#1f78c8" stroke="#fff" stroke-width="5"/>
        <text x="-1" y="40" text-anchor="middle" class="point">既知点A</text>
      </g>
      <g transform="translate(101 104)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="-1" y="-22" text-anchor="middle" class="point">P1</text>
      </g>
      <g transform="translate(190 196)">
        <circle r="12" fill="#fff" stroke="#315a87" stroke-width="5"/>
        <text x="0" y="37" text-anchor="middle" class="point">P2</text>
      </g>
      <g transform="translate(278 67)">
        <circle r="12" fill="#fff" stroke="#db6b2c" stroke-width="5"/>
        <text x="0" y="-22" text-anchor="middle" class="point">未知点P3</text>
      </g>
    </g>
    <rect x="24" y="406" width="306" height="48" rx="13" fill="#fff1e7"/>
    <text x="177" y="436" text-anchor="middle" class="badge" fill="#b85825">経路だけでは誤差を見つけにくい</text>
  </g>

  <g transform="translate(48 618)">
    <circle cx="8" cy="-1" r="9" fill="#1f78c8"/>
    <text x="25" y="5" class="subtitle">塗りつぶし＝位置が分かっている既知点</text>
    <circle cx="403" cy="-1" r="8" fill="#fff" stroke="#315a87" stroke-width="4"/>
    <text x="420" y="5" class="subtitle">白丸＝位置を求める新点</text>
  </g>
</svg>
